name: Diagnose RPD runtime

on:
  push:
    branches: ['release/rpd-v2.3.1-work-final']
    paths: ['.github/workflows/harden-v231.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rpd-v2.3.1-work-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture bootstrap exception
        run: |
          set +e
          npx playwright test tests/runtime.spec.js --workers=1 --retries=0 --timeout=5000 --reporter=line > RUNTIME_DIAGNOSTIC.txt 2>&1
          echo "$?" > RUNTIME_EXIT.txt
          exit 0
      - name: Commit runtime diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUNTIME_DIAGNOSTIC.txt RUNTIME_EXIT.txt
          git commit -m "test: registrar exceção de bootstrap da v2.3.1"
          git push origin HEAD:release/rpd-v2.3.1-work-final
