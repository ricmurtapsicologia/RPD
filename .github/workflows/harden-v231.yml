name: Finalize RPD v2.3.1

on:
  push:
    branches: ['release/rpd-v2.3.1-work-final']
    paths: ['.github/workflows/harden-v231.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rpd-v2.3.1-work-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Fix DOM bootstrap collision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/app.js')
          s=p.read_text(encoding='utf-8')
          old='    form.before(bar);'
          new='    form.parentNode.insertBefore(bar,form);'
          if old not in s:
              raise SystemExit('Trecho de bootstrap esperado não encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Structural gate
        run: npm run validate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime bootstrap gate
        run: npx playwright test tests/runtime.spec.js --workers=1 --retries=0 --timeout=5000
      - name: Full browser regression gate
        run: npm run test:e2e
      - name: Remove migration and diagnostic artifacts
        run: |
          rm -f E2E_DIAGNOSTIC.txt E2E_EXIT.txt RUNTIME_DIAGNOSTIC.txt RUNTIME_EXIT.txt PATCH_DIAGNOSTIC.txt
          rm -f tests/runtime.spec.js scripts/harden_v231.py
          rm -f .github/workflows/diagnose-v230-patches.yml
          rm -f .github/workflows/harden-v231.yml
      - name: Commit validated release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: validar RPD v2.3.1 para promoção"
          git push origin HEAD:release/rpd-v2.3.1-work-final
