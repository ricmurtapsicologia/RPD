name: Harden RPD v2.3.1

on:
  push:
    branches: ['release/rpd-v2.3.1-work-final']
    paths: ['.github/workflows/harden-v231.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rpd-v2.3.1-work-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repair migration bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/harden_v231.py')
          s = path.read_text(encoding='utf-8')
          start = s.index('def apply_v230_if_needed():')
          end = s.index('\n\ndef harden_index():', start)
          replacement = '''def apply_v230_if_needed():\n    js = read("assets/js/app.js")\n    if 'const VERSION="2.2.0"' in js:\n        subprocess.run(["git", "apply", "scripts/js_v230.patch"], cwd=ROOT, check=True)\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('s = read("index.html").replace("2.3.0", VERSION)', 's = read("index.html").replace("2.2.0", VERSION).replace("2.3.0", VERSION)')
          path.write_text(s, encoding='utf-8')
          PY

      - name: Apply v2.3.1 hardening
        run: python3 scripts/harden_v231.py

      - name: Create deterministic npm lock
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Structural gate
        run: npm run validate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture browser regression
        run: |
          set +e
          npx playwright test --workers=1 --timeout=8000 --reporter=line > E2E_DIAGNOSTIC.txt 2>&1
          CODE=$?
          echo "$CODE" > E2E_EXIT.txt
          exit 0

      - name: Commit candidate and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: materializar candidata v2.3.1 e diagnóstico E2E"
          git push origin HEAD:release/rpd-v2.3.1-work-final
