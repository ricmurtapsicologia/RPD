name: Diagnose residual RPD v2.3.1

on:
  push:
    branches: ['release/rpd-v2.3.1-work-final']
    paths: ['.github/workflows/harden-v231.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-residual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rpd-v2.3.1-work-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Fix DOM bootstrap collision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/app.js')
          s=p.read_text(encoding='utf-8')
          old='    form.before(bar);'
          new='    form.parentNode.insertBefore(bar,form);'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Structural gate
        run: npm run validate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime bootstrap gate
        run: npx playwright test tests/runtime.spec.js --workers=1 --retries=0 --timeout=5000
      - name: Capture residual regression
        run: |
          set +e
          npm run test:e2e > FINAL_E2E_DIAGNOSTIC.txt 2>&1
          echo "$?" > FINAL_E2E_EXIT.txt
          exit 0
      - name: Commit fixed bootstrap and residual diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materializar bootstrap v2.3.1 e diagnóstico residual"
          git push origin HEAD:release/rpd-v2.3.1-work-final
