name: Diagnose v2.3 patches

on:
  push:
    branches: ['release/rpd-v2.3.1-work-final']
    paths: ['.github/workflows/diagnose-v230-patches.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rpd-v2.3.1-work-final
          fetch-depth: 0
      - name: Check patch applicability
        run: |
          : > PATCH_DIAGNOSTIC.txt
          for p in scripts/index_v230.patch scripts/js_v230.patch scripts/validate_v230.patch; do
            echo "### $p" >> PATCH_DIAGNOSTIC.txt
            git apply --check "$p" >> PATCH_DIAGNOSTIC.txt 2>&1 && echo "OK" >> PATCH_DIAGNOSTIC.txt || echo "FAIL" >> PATCH_DIAGNOSTIC.txt
            echo >> PATCH_DIAGNOSTIC.txt
          done
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PATCH_DIAGNOSTIC.txt
          git commit -m "chore: registrar diagnóstico dos patches v2.3"
          git push origin HEAD:release/rpd-v2.3.1-work-final
