name: Hotfix analytics — acessibilidade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-analytics-a11y.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir semântica do banner de consentimento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/ric-analytics.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION = '1.1.1';", "const VERSION = '1.1.2';")
          s=s.replace("const box = document.createElement('aside');", "const box = document.createElement('div');")
          p.write_text(s, encoding='utf-8')
          PY
          grep -q "VERSION = '1.1.2'" assets/js/ric-analytics.js
          grep -q "createElement('div')" assets/js/ric-analytics.js
      - name: Publicar hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/ric-analytics.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corrige semântica ARIA do consentimento de analytics'
          git push origin HEAD:main
