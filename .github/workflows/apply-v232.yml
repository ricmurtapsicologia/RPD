name: Apply RPD v2.3.2 Hardening

on:
  push:
    branches:
      - release/v2.3.2-safety-privacy-qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.3.2-safety-privacy-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare image dependency
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Repair helper syntax and compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_v232.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          lines=[line for line in lines if not line.strip().startswith('readme = readme.replace("softwareVersion":')]
          p.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply_v232.py
      - name: Apply v2.3.2 patch
        run: python3 scripts/apply_v232.py
      - name: Normalize generated candidate and validation gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/validate.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'Content-Security-Policy', 'assets/og-card.png', 'Não sei/não consigo nomear agora',",
                      "'Content-Security-Policy', 'assets/og-card.png',")
          s=s.replace("'renderSummary', 'buildPrint'\n]",
                      "'renderSummary', 'buildPrint', 'Não sei/não consigo nomear agora'\n]")
          s=s.replace("<lastmod>2026-09-05</lastmod>", "<lastmod>2026-09-07</lastmod>")
          p.write_text(s, encoding='utf-8')

          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace("**Versão candidata: v2.3.2 — 2026-09-07**",
                      "**Versão canônica: v2.3.2 — 07/09/2026**")
          p.write_text(s, encoding='utf-8')

          p=Path('privacidade.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('somente o identificador do áudio e o segundo aproximado de reprodução',
                      'somente o identificador do áudio e o segundo de reprodução')
          p.write_text(s, encoding='utf-8')

          # Regressão visual canônica é feita em Chromium; compatibilidade funcional continua nos 3 motores.
          p=Path('tests/visual.spec.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("async ({ page }) => {\n    await page.setViewportSize",
                      "async ({ page, browserName }) => {\n    test.skip(browserName !== 'chromium', 'baseline visual canônica em Chromium');\n    await page.setViewportSize")
          p.write_text(s, encoding='utf-8')

          # Reflow 400% é uma prova de layout Chromium; axe continua em todos os motores.
          p=Path('tests/a11y.spec.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("test('reflow continua funcional em zoom equivalente a 400%', async ({ page }) => {",
                      "test('reflow continua funcional em zoom equivalente a 400%', async ({ page, browserName }) => {\n  test.skip(browserName !== 'chromium', 'zoom CSS canônico em Chromium');")
          p.write_text(s, encoding='utf-8')

          # Evita multiplicar timeouts de diagnóstico; um erro deve falhar de forma rápida e reproduzível.
          p=Path('playwright.config.js')
          s=p.read_text(encoding='utf-8').replace('retries: 1,', 'retries: 0,')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install accessibility dependency and refresh lockfile
        run: npm install --save-dev @axe-core/playwright@latest
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Structural validation
        run: npm run validate
      - name: Seed visual baselines
        run: npx playwright test tests/visual.spec.js --project=chromium --update-snapshots
      - name: Full browser, accessibility, visual and PDF regression
        run: npx playwright test --max-failures=12
      - name: Commit validated candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!scripts/apply_v232.py' ':!.github/workflows/apply-v232.yml'
          git commit -m 'RPD v2.3.2 — safety, privacy and QA hardening'
          git push origin HEAD:release/v2.3.2-safety-privacy-qa
