name: Apply RPD v2.3.2 Hardening

on:
  push:
    branches:
      - release/v2.3.2-safety-privacy-qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.3.2-safety-privacy-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare image dependency
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Repair helper syntax and compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_v232.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          lines=[line for line in lines if not line.strip().startswith('readme = readme.replace("softwareVersion":')]
          p.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply_v232.py
      - name: Apply v2.3.2 patch
        run: python3 scripts/apply_v232.py
      - name: Normalize candidate and repair release blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/validate.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'Content-Security-Policy', 'assets/og-card.png', 'Não sei/não consigo nomear agora',", "'Content-Security-Policy', 'assets/og-card.png',")
          s=s.replace("'renderSummary', 'buildPrint'\n]", "'renderSummary', 'buildPrint', 'Não sei/não consigo nomear agora'\n]")
          s=s.replace('progressCard.setAttribute("role","progressbar")', 'progressTrack.setAttribute("role","progressbar")')
          s=s.replace("<lastmod>2026-09-05</lastmod>", "<lastmod>2026-09-07</lastmod>")
          p.write_text(s, encoding='utf-8')

          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace("**Versão candidata: v2.3.2 — 2026-09-07**", "**Versão canônica: v2.3.2 — 07/09/2026**")
          p.write_text(s, encoding='utf-8')

          p=Path('privacidade.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('somente o identificador do áudio e o segundo aproximado de reprodução', 'somente o identificador do áudio e o segundo de reprodução')
          p.write_text(s, encoding='utf-8')

          p=Path('assets/js/app.js')
          s=p.read_text(encoding='utf-8')
          old='    progressCard.setAttribute("role","progressbar");\n    progressCard.setAttribute("aria-valuemin","1");\n    progressCard.setAttribute("aria-valuemax","7");\n    progressCard.setAttribute("aria-valuenow","1");\n    progressCard.setAttribute("aria-valuetext","Etapa 1 de 7 · modo completo");\n    $(".progress-track",progressCard)?.setAttribute("aria-hidden","true");'
          new='    const progressTrack=$(".progress-track",progressCard);\n    if(progressTrack){\n      progressTrack.setAttribute("role","progressbar");\n      progressTrack.setAttribute("aria-valuemin","1");\n      progressTrack.setAttribute("aria-valuemax","7");\n      progressTrack.setAttribute("aria-valuenow","1");\n      progressTrack.setAttribute("aria-valuetext","Etapa 1 de 7 · modo completo");\n    }'
          if old not in s: raise SystemExit('bloco inicial de progresso não encontrado')
          s=s.replace(old,new,1)
          old='  const progressCard=$("#progressCard");\n  if(progressCard){\n    progressCard.setAttribute("aria-valuemax",String(total));\n    progressCard.setAttribute("aria-valuenow",String(pos));\n    progressCard.setAttribute("aria-valuetext",progressText);\n  }'
          new='  const progressTrack=$("#progressCard .progress-track");\n  if(progressTrack){\n    progressTrack.setAttribute("aria-valuemax",String(total));\n    progressTrack.setAttribute("aria-valuenow",String(pos));\n    progressTrack.setAttribute("aria-valuetext",progressText);\n  }'
          if old not in s: raise SystemExit('bloco dinâmico de progresso não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div id="distortionQuick" class="distortion-quick" aria-label="Opções rápidas de classificação"></div>'
          new='<div id="distortionQuick" class="distortion-quick" role="group" aria-label="Opções rápidas de classificação"></div>'
          if old not in s: raise SystemExit('grupo rápido de distorções não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')

          p=Path('tests/rpd.spec.js')
          s=p.read_text(encoding='utf-8').replace('2.3.1','2.3.2')
          s=s.replace("page.locator('#progressCard')).toHaveAttribute('role', 'progressbar')", "page.locator('#progressCard .progress-track')).toHaveAttribute('role', 'progressbar')")
          s=s.replace("page.locator('#progressCard')).toHaveAttribute('aria-valuemax', '7')", "page.locator('#progressCard .progress-track')).toHaveAttribute('aria-valuemax', '7')")
          s=s.replace("page.locator('#progressCard')).toHaveAttribute('aria-valuemax', '5')", "page.locator('#progressCard .progress-track')).toHaveAttribute('aria-valuemax', '5')")
          p.write_text(s, encoding='utf-8')

          p=Path('tests/runtime.spec.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("page.locator('#progressCard')).toHaveAttribute('role', 'progressbar')", "page.locator('#progressCard .progress-track')).toHaveAttribute('role', 'progressbar')")
          p.write_text(s, encoding='utf-8')

          for rel in ['tests/rpd.spec.js','tests/hardening.spec.js']:
              p=Path(rel)
              s=p.read_text(encoding='utf-8')
              s=s.replace("await page.locator('#emotion_0').check({ force: true });", "await page.locator('label.choice').first().click();\n  await expect(page.locator('#emotion_0')).toBeChecked();")
              s=s.replace("await page.locator('#modeEssential').check({ force: true });", "await page.locator('label.mode-card').filter({ hasText: 'Essencial' }).click();\n  await expect(page.locator('#modeEssential')).toBeChecked();")
              p.write_text(s, encoding='utf-8')

          p=Path('tests/hardening.spec.js')
          s=p.read_text(encoding='utf-8')
          old="test('novo registro elimina rascunho e respostas', async ({ page }) => {\n  await page.locator('#draftToggle').check();\n  await page.locator('#situation').fill('Conteúdo temporário.');\n  await page.locator('#newRecord').click();"
          new="test('novo registro elimina rascunho e respostas', async ({ page }) => {\n  await page.locator('#draftToggle').check();\n  await reachEssentialSummary(page);\n  await expect(page.locator('#newRecord')).toBeVisible();\n  await page.locator('#newRecord').click();"
          if old not in s: raise SystemExit('teste de novo registro não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')

          p=Path('tests/a11y.spec.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  await page.evaluate(() => { document.documentElement.style.zoom = '4'; });\n", "")
          p.write_text(s, encoding='utf-8')

          p=Path('tests/visual.spec.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("async ({ page }) => {\n    await page.setViewportSize", "async ({ page, browserName }) => {\n    test.skip(browserName !== 'chromium', 'baseline visual canônica em Chromium');\n    await page.setViewportSize")
          p.write_text(s, encoding='utf-8')

          p=Path('playwright.config.js')
          s=p.read_text(encoding='utf-8').replace('retries: 1,', 'retries: 0,')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install accessibility dependency and refresh lockfile
        run: npm install --save-dev @axe-core/playwright@latest
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Structural validation
        run: npm run validate
      - name: Seed visual baselines
        run: npx playwright test tests/visual.spec.js --project=chromium --update-snapshots
      - name: Full browser, accessibility, visual and PDF regression
        run: npx playwright test --max-failures=12
      - name: Commit validated candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!scripts/apply_v232.py' ':!.github/workflows/apply-v232.yml'
          git commit -m 'RPD v2.3.2 — safety, privacy and QA hardening'
          git push origin HEAD:release/v2.3.2-safety-privacy-qa
