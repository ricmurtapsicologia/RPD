name: Restore RPD media and distortion guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-media.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply media and psychoeducation refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'missing {label}')
              s=s.replace(old,new,1)

          rep('.cta-panel .btn{background:#fff;color:var(--primary2)}\n.contact-grid', '''.cta-panel .btn{background:#fff;color:var(--primary2)}
          .media-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.media-card{border:1px solid var(--border);border-radius:18px;padding:16px;background:var(--surface)}.media-card h3{margin:0 0 5px;font-size:1.05rem}.media-card p{margin:0 0 12px;color:var(--muted);font-size:.87rem}.media-card audio{width:100%;margin-top:4px}.video-wrap{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0f2522}.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.learning-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.distortion-guide{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}.distortion-guide-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}.distortion-guide-head h3{margin:0;font-size:1.25rem}.distortion-guide-head p{margin:3px 0 0;color:var(--muted);font-size:.88rem;max-width:730px}.distortion-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.distortion-card{border:1px solid var(--border);border-radius:15px;padding:13px;background:#fff}.distortion-card b{display:block;color:var(--primary2);margin-bottom:4px}.distortion-card p{margin:0;color:var(--muted);font-size:.84rem}.distortion-card .example{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border);color:#4d615e}.guide-tip{margin-top:12px;padding:11px 12px;border-radius:13px;background:var(--goldsoft);border:1px solid #e6d0a8;color:#665338;font-size:.82rem}.inline-help-cta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 13px;padding:11px 12px;border:1px solid var(--border);border-radius:14px;background:var(--surface2)}.inline-help-cta p{margin:0;color:var(--muted);font-size:.83rem}
          .contact-grid''', 'css')
          s=s.replace('@media(max-width:780px){.howto{grid-template-columns:1fr 1fr}.emotion-grid,.distortion-grid{grid-template-columns:1fr 1fr}', '@media(max-width:780px){.howto{grid-template-columns:1fr 1fr}.media-grid,.distortion-cards{grid-template-columns:1fr}.emotion-grid,.distortion-grid{grid-template-columns:1fr 1fr}',1)

          rep('''  <div class="cta-panel"><div><b>Use um episódio específico.</b><p>Registros concretos costumam ser mais úteis do que tentar explicar “como eu sou” de forma geral.</p></div><a class="btn" href="#form-area">Começar agora</a></div>
          </div></section>''','''  <div class="cta-panel"><div><b>Use um episódio específico.</b><p>Registros concretos costumam ser mais úteis do que tentar explicar “como eu sou” de forma geral.</p></div><a class="btn" href="#form-area">Começar agora</a></div>

            <div class="section-head" style="margin-top:24px"><span class="kicker">Aprenda antes de preencher</span><h2>Prefere ouvir, assistir ou consultar exemplos?</h2><p>Use o formato que facilitar sua compreensão. Depois, volte ao registro e aplique ao episódio que você viveu.</p></div>
            <div class="media-grid">
              <article class="media-card"><h3>Ouvir explicação</h3><p>Áudio breve sobre o que é o RPD e como preencher sem transformar o exercício em uma prova.</p><audio controls preload="none"><source src="https://raw.githubusercontent.com/ricmurtapsicologia/RPD/main/RPD1.mp3" type="audio/mpeg">Seu navegador não suporta áudio.</audio><div class="learning-cta"><a class="btn btn-secondary" href="#form-area">Depois do áudio, começar registro</a></div></article>
              <article class="media-card"><h3>Assistir explicação</h3><p>Vídeo de apoio para visualizar a lógica do registro antes de preencher.</p><div class="video-wrap"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/qp8VUlVqooI" title="Como fazer um Registro de Pensamentos" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="learning-cta"><a class="btn btn-secondary" href="#form-area">Depois do vídeo, começar registro</a></div></article>
            </div>

            <div id="guia-distorcoes" class="distortion-guide">
              <div class="distortion-guide-head"><div><span class="kicker">Guia para leigos</span><h3>Como reconhecer possíveis distorções de pensamento</h3><p>Você não precisa conhecer os nomes de memória. Compare seu pensamento automático com as descrições e exemplos abaixo. Um mesmo pensamento pode se parecer com mais de um padrão — e também pode não se encaixar claramente em nenhum.</p></div><a class="btn btn-primary" href="#form-area">Ir para o registro</a></div>
              <div id="distortionGuideCards" class="distortion-cards"></div>
              <div class="guide-tip"><strong>Regra prática:</strong> não escolha pelo nome que parece mais forte. Escolha pelo modo como o pensamento funciona. Se continuar em dúvida, marque “Não sei ainda” e leve essa dúvida para a conversa terapêutica.</div>
            </div>
          </div></section>''','intro media')

          rep('''      <div class="field"><label for="thought">O que passou pela sua mente?</label><textarea id="thought" required placeholder="Escreva a frase como ela apareceu, sem corrigir ou suavizar."></textarea></div>
                <fieldset><legend>Padrões de pensamento que podem estar presentes — opcional</legend>''','''      <div class="field"><label for="thought">O que passou pela sua mente?</label><textarea id="thought" required placeholder="Escreva a frase como ela apareceu, sem corrigir ou suavizar."></textarea></div>
                <div class="inline-help-cta"><p><strong>Não sabe qual padrão escolher?</strong> Consulte definições e exemplos em linguagem simples antes de marcar.</p><a class="btn btn-secondary" href="#guia-distorcoes">Ver explicações e exemplos</a></div>
                <fieldset><legend>Padrões de pensamento que podem estar presentes — opcional</legend>''','stage3 cta')

          old='''const DISTORTIONS=[
          ["Catastrofização","Imaginar um desfecho muito ruim como se fosse inevitável."],
          ["Supergeneralização","Transformar um episódio específico em uma regra geral."],
          ["Leitura mental","Concluir o que outras pessoas pensam sem evidências suficientes."],
          ["Personalização","Assumir responsabilidade excessiva por algo que envolve vários fatores."],
          ["Tudo ou nada","Avaliar em extremos e perder gradações intermediárias."],
          ["Desqualificação do positivo","Minimizar ou invalidar evidências favoráveis."],
          ["Raciocínio emocional","Tratar uma emoção como prova suficiente de que algo é verdadeiro."],
          ["Rotulação","Definir a si ou outra pessoa por um rótulo rígido."],
          ["Filtro mental","Focar quase exclusivamente em um aspecto negativo."],
          ["Não identifiquei um padrão","Nenhum padrão ficou claro neste momento."],
          ["Não sei ainda","Prefiro deixar essa classificação em aberto."]
          ];'''
          new='''const DISTORTIONS=[
          ["Catastrofização","Imaginar um desfecho muito ruim como se fosse provável ou inevitável, mesmo quando ainda existem vários resultados possíveis.","Ex.: “Se eu errar nesta apresentação, minha carreira acabou.”"],
          ["Supergeneralização","Usar um episódio específico como prova de uma regra ampla sobre você, os outros ou o futuro.","Ex.: “Não consegui desta vez; eu nunca consigo nada.”"],
          ["Leitura mental","Acreditar que sabe o que outra pessoa pensa ou sente sem ter evidências suficientes.","Ex.: “Ela ficou séria; com certeza acha que sou incompetente.”"],
          ["Personalização","Assumir responsabilidade excessiva por um resultado que depende de vários fatores ou pessoas.","Ex.: “A reunião foi ruim porque eu estraguei tudo.”"],
          ["Tudo ou nada","Avaliar pessoas ou situações em extremos, como sucesso total ou fracasso total, sem reconhecer graus intermediários.","Ex.: “Se não ficou perfeito, ficou péssimo.”"],
          ["Desqualificação do positivo","Diminuir, explicar ou invalidar evidências positivas para que elas não contem na avaliação.","Ex.: “Só elogiaram porque foram educados.”"],
          ["Raciocínio emocional","Tratar o que você sente como se fosse prova suficiente de que algo é objetivamente verdadeiro.","Ex.: “Estou com medo, então deve haver um perigo real.”"],
          ["Rotulação","Transformar um comportamento, erro ou dificuldade em uma definição rígida da pessoa inteira.","Ex.: “Cometi um erro; sou um fracasso.”"],
          ["Filtro mental","Prender a atenção quase só a uma parte negativa e perder de vista informações relevantes do restante da situação.","Ex.: “Recebi vários retornos bons, mas só consigo pensar na única crítica.”"],
          ["Não identifiquei um padrão","Nenhum desses padrões ficou claro neste momento.","Use quando seu pensamento não parecer se encaixar nas descrições acima."],
          ["Não sei ainda","A classificação pode ficar em aberto.","Use quando você ainda estiver em dúvida; não é necessário decidir sozinho."]
          ];'''
          rep(old,new,'distortion data')

          rep('''function setupChoices(){
           $("#emotionGrid").innerHTML=EMOTIONS.map(x=>`<label class="choice"><input type="checkbox" name="emotion" value="${x}"><span>${x}</span></label>`).join("");
           $("#distortionGrid").innerHTML=DISTORTIONS.map(([x,d])=>`<label class="choice" title="${d}"><input type="checkbox" name="distortion" value="${x}"><span>${x}</span></label>`).join("");
          }''','''function setupChoices(){
           $("#emotionGrid").innerHTML=EMOTIONS.map(x=>`<label class="choice"><input type="checkbox" name="emotion" value="${x}"><span>${x}</span></label>`).join("");
           $("#distortionGrid").innerHTML=DISTORTIONS.map(([x,d,e])=>`<label class="choice" title="${d} ${e}"><input type="checkbox" name="distortion" value="${x}" aria-label="${x}: ${d} ${e}"><span>${x}</span></label>`).join("");
           const guide=$("#distortionGuideCards");
           if(guide)guide.innerHTML=DISTORTIONS.slice(0,9).map(([x,d,e])=>`<article class="distortion-card"><b>${x}</b><p>${d}</p><p class="example"><strong>Exemplo:</strong> ${e.replace(/^Ex\\.:\\s*/,"")}</p></article>`).join("");
          }''','setup guide')
          p.write_text(s,encoding='utf-8')

          r=Path('README.md').read_text(encoding='utf-8')
          r=r.replace('A classificação de padrões de pensamento é opcional e admite múltiplas escolhas.','A classificação de padrões de pensamento é opcional e admite múltiplas escolhas. A interface inclui um **guia para leigos** com definição e exemplo de cada padrão, além de um CTA na etapa 3 para consultar essas explicações antes de marcar qualquer opção.',1)
          r=r.replace('## PDF','''## Conteúdo multimídia\n\nA página preserva o **áudio explicativo RPD1.mp3** e o **vídeo explicativo**. O vídeo usa o modo de privacidade aprimorada do YouTube (`youtube-nocookie.com`) e carregamento adiado. Ambos possuem CTAs para retornar ao registro.\n\n## PDF''',1)
          Path('README.md').write_text(r,encoding='utf-8')

          q=Path('privacidade.html').read_text(encoding='utf-8')
          q=q.replace('<h2>5. Links e serviços externos</h2><p>A página contém links para outras páginas do ecossistema, para WhatsApp e para o Centro de Valorização da Vida (CVV). Ao abrir um serviço externo, passam a valer as políticas do respectivo serviço.</p>','<h2>5. Áudio, vídeo e serviços externos</h2><p>O RPD oferece um áudio explicativo hospedado no próprio repositório GitHub e um vídeo incorporado com o modo de privacidade aprimorada do YouTube (<code>youtube-nocookie.com</code>). Ao carregar ou reproduzir o vídeo pode haver comunicação técnica com a infraestrutura do YouTube/Google conforme as políticas desse serviço.</p><p>A página também contém links para outras páginas do ecossistema e para WhatsApp. Ao abrir ou reproduzir conteúdo externo, passam a valer também as políticas do respectivo serviço.</p>',1)
          Path('privacidade.html').write_text(q,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html README.md privacidade.html
          git commit -m "Restaura mídia e adiciona guia didático de distorções" || exit 0
          git rm .github/workflows/refine-media.yml
          git commit -m "Remove workflow temporário de refinamento"
          git push
