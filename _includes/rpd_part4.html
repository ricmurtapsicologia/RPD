<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(()=>{"use strict";
const WHATSAPP="5535984640729";
const PAGE_URL="https://ricmurtapsicologia.github.io/RPD/";
const EMOTIONS=["Ansiedade","Tristeza","Raiva","Culpa","Medo","Vergonha","Frustração","Insegurança","Desânimo","Solidão","Confusão","Alívio","Alegria","Outra"];
const DISTORTIONS=[
["Catastrofização","Imaginar um desfecho muito ruim como se fosse provável ou inevitável, mesmo quando ainda existem vários resultados possíveis.","Ex.: “Se eu errar nesta apresentação, minha carreira acabou.”"],
["Supergeneralização","Usar um episódio específico como prova de uma regra ampla sobre você, os outros ou o futuro.","Ex.: “Não consegui desta vez; eu nunca consigo nada.”"],
["Leitura mental","Acreditar que sabe o que outra pessoa pensa ou sente sem ter evidências suficientes.","Ex.: “Ela ficou séria; com certeza acha que sou incompetente.”"],
["Personalização","Assumir responsabilidade excessiva por um resultado que depende de vários fatores ou pessoas.","Ex.: “A reunião foi ruim porque eu estraguei tudo.”"],
["Tudo ou nada","Avaliar pessoas ou situações em extremos, como sucesso total ou fracasso total, sem reconhecer graus intermediários.","Ex.: “Se não ficou perfeito, ficou péssimo.”"],
["Desqualificação do positivo","Diminuir, explicar ou invalidar evidências positivas para que elas não contem na avaliação.","Ex.: “Só elogiaram porque foram educados.”"],
["Raciocínio emocional","Tratar o que você sente como se fosse prova suficiente de que algo é objetivamente verdadeiro.","Ex.: “Estou com medo, então deve haver um perigo real.”"],
["Rotulação","Transformar um comportamento, erro ou dificuldade em uma definição rígida da pessoa inteira.","Ex.: “Cometi um erro; sou um fracasso.”"],
["Filtro mental","Prender a atenção quase só a uma parte negativa e perder de vista informações relevantes do restante da situação.","Ex.: “Recebi vários retornos bons, mas só consigo pensar na única crítica.”"],
["Não identifiquei um padrão","Nenhum desses padrões ficou claro neste momento.","Use quando seu pensamento não parecer se encaixar nas descrições acima."],
["Não sei ainda","A classificação pode ficar em aberto.","Use quando você ainda estiver em dúvida; não é necessário decidir sozinho."]
];
let step=1;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const toast=msg=>{const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),3600)};
const val=id=>document.getElementById(id)?.value?.trim()||"";
const checked=name=>$$(`input[name="${name}"]:checked`).map(x=>x.value);
function setupChoices(){
 $("#emotionGrid").innerHTML=EMOTIONS.map(x=>`<label class="choice"><input type="checkbox" name="emotion" value="${x}"><span>${x}</span></label>`).join("");
 $("#distortionGrid").innerHTML=DISTORTIONS.map(([x,d,e])=>`<label class="choice" title="${d} ${e}"><input type="checkbox" name="distortion" value="${x}" aria-label="${x}: ${d} ${e}"><span>${x}</span></label>`).join("");
 const guide=$("#distortionGuideCards");
 if(guide)guide.innerHTML=DISTORTIONS.slice(0,9).map(([x,d,e])=>`<article class="distortion-card"><b>${x}</b><p>${d}</p><p class="example"><strong>Exemplo:</strong> ${e.replace(/^Ex\.:\s*/,"")}</p></article>`).join("");
}
function updateSelections(){
 const e=checked("emotion"),d=checked("distortion");
 $("#selectedEmotions").textContent=`Emoções selecionadas: ${e.length?e.join(", "):"nenhuma"}.`;
 $("#selectedDistortions").textContent=`Padrões selecionados: ${d.length?d.join(", "):"nenhum"}.`;
}
document.addEventListener("change",ev=>{
 if(ev.target.matches('input[name="emotion"]'))updateSelections();
 if(ev.target.matches('input[name="distortion"]')){
   const special=["Não identifiquei um padrão","Não sei ainda"];
   if(special.includes(ev.target.value)&&ev.target.checked){$$('input[name="distortion"]').forEach(x=>{if(x!==ev.target)x.checked=false})}
   else if(ev.target.checked){$$('input[name="distortion"]').forEach(x=>{if(special.includes(x.value))x.checked=false})}
   updateSelections();
 }
});
function bindRange(id,out){const a=$("#"+id),o=$("#"+out),f=()=>o.textContent=`${a.value}/100`;a.addEventListener("input",f);f()}
function progress(){
 const pct=Math.round(step/7*100);$("#progressLabel").textContent=`Etapa ${step} de 7`;$("#progressPercent").textContent=`${pct}%`;$("#progressBar").style.width=`${pct}%`
}
function showStep(n){step=Math.max(1,Math.min(7,n));$$(".step").forEach(x=>x.classList.toggle("is-active",Number(x.dataset.step)===step));progress();if(step===7)renderSummary();$("#form-area").scrollIntoView({behavior:"smooth",block:"start"})}
function validate(){
 const active=$(`.step[data-step="${step}"]`);
 for(const f of Array.from(active.querySelectorAll("input,textarea,select"))){
   if(f.type==="checkbox"||f.type==="range")continue;
   if(!f.checkValidity()){f.reportValidity();f.focus();return false}
 }
 if(step===2&&checked("emotion").length===0){toast("Selecione pelo menos uma emoção para continuar.");return false}
 return true
}
$$(".next").forEach(b=>b.addEventListener("click",()=>{if(validate())showStep(step+1)}));
$$(".prev").forEach(b=>b.addEventListener("click",()=>showStep(step-1)));
function data(){
 const before=Number($("#before").value),after=Number($("#after").value),diff=after-before;
 return{
  identity:val("identity")||"Não informado",date:val("date"),situation:val("situation"),
  emotions:checked("emotion").join(", "),before:`${before}/100`,thought:val("thought"),
  distortions:checked("distortion").join(", ")||"Não classificado",
  supporting:val("supporting"),contrary:val("contrary"),alternative:val("alternative"),
  perspective:val("perspective")||"Não informado",status:val("status"),utility:val("utility"),
  value:val("value"),action:val("action"),distance:val("distance")||"Não informado",
  response:val("response"),stateNow:val("stateNow")||"Não informado",after:`${after}/100`,
  change:diff===0?"sem mudança numérica":diff>0?`${diff} ponto(s) maior`:`${Math.abs(diff)} ponto(s) menor`
 }
}
function renderSummary(){
 const d=data(),items=[
  ["Situação",d.situation,true],["Emoções",d.emotions,false],["Desconforto antes",d.before,false],
  ["Pensamento automático",d.thought,true],["Padrões possíveis",d.distortions,true],
  ["Evidências que sustentam",d.supporting,true],["Evidências que não sustentam completamente",d.contrary,true],
  ["Outra explicação possível",d.alternative,true],["Perspectiva externa",d.perspective,true],
  ["Status do pensamento",d.status,false],["Utilidade percebida",d.utility,false],
  ["Valor importante",d.value,false],["Pequena ação possível",d.action,true],["Distância do pensamento",d.distance,true],
  ["Resposta alternativa",d.response,true],["Estado emocional atual",d.stateNow,true],["Desconforto depois",d.after,false]
 ];
 $("#summary").innerHTML=items.map(([k,v,full])=>`<div class="summary-item${full?" full":""}"><strong>${k}</strong><span></span></div>`).join("");
 $$("#summary .summary-item").forEach((el,i)=>el.querySelector("span").textContent=items[i][1]);
 $("#beforeSummary").textContent=d.before;$("#afterSummary").textContent=d.after;$("#deltaSummary").textContent=`(${d.change})`;
}
function fullValid(){
 for(let n=1;n<=6;n++){step=n;if(!validate()){showStep(n);return false}}
 step=7;progress();return true
}
function message(){
 const d=data();
 return[
 "Registro de Pensamentos — RPD",
 `Nome/iniciais: ${d.identity}`,`Data: ${d.date}`,`Situação: ${d.situation}`,
 `Emoções: ${d.emotions}`,`Desconforto antes: ${d.before}`,`Pensamento automático: ${d.thought}`,
 `Padrões possíveis: ${d.distortions}`,"",`Evidências que sustentam: ${d.supporting}`,
 `Evidências que não sustentam completamente: ${d.contrary}`,`Outra explicação possível: ${d.alternative}`,
 `Perspectiva externa: ${d.perspective}`,`Pensamento: ${d.status}`,`Utilidade: ${d.utility}`,"",
 `Valor importante: ${d.value}`,`Pequena ação possível: ${d.action}`,`Se eu não obedecer automaticamente ao pensamento: ${d.distance}`,"",
 `Resposta alternativa: ${d.response}`,`Estado emocional atual: ${d.stateNow}`,`Desconforto depois: ${d.after}`,
 `Mudança percebida: ${d.change}`,"","Material psicoeducativo; não constitui diagnóstico."
 ].join("\n")
}
$("#shareRecord").addEventListener("click",()=>{
 if(!fullValid())return;
 const text=message();
 if(!confirm("O registro pode conter informações pessoais e emocionais. Revise o conteúdo antes de abrir o WhatsApp. Continuar?"))return;
 window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`,"_blank","noopener,noreferrer")
});
function setText(id,text,empty="Não informado"){const el=$("#"+id);el.textContent=(text||"").trim()||empty}
function buildPrint(){
 const d=data();
 setText("pIdentity",d.identity);setText("pDate",d.date);setText("pEmotions",d.emotions);
 setText("pSituation",d.situation);setText("pThought",`Pensamento automático: ${d.thought}\nPadrões possíveis: ${d.distortions}\nClassificação atual: ${d.status}\nUtilidade percebida: ${d.utility}`);
 setText("pDistortions",`Perspectiva externa: ${d.perspective}`);setText("pSupporting",d.supporting);setText("pContrary",d.contrary);
 setText("pAlternative",d.alternative);setText("pValues",`Valor importante: ${d.value}\nPequena ação possível: ${d.action}\nSe eu não obedecer automaticamente ao pensamento: ${d.distance}`);
 setText("pResponse",d.response);setText("pBefore",d.before);setText("pAfter",d.after);setText("pState",`Estado emocional atual: ${d.stateNow}\nMudança percebida: ${d.change}`);
 $("#pEvidenceGrid").classList.toggle("stack",(d.supporting.length+d.contrary.length)>900);
 const now=new Date();setText("pGenerated",`Gerado em ${now.toLocaleDateString("pt-BR")} às ${now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`)
}
$("#printPdf").addEventListener("click",()=>{
 if(!fullValid())return;buildPrint();
 if(confirm("A versão para impressão pode conter informações pessoais e emocionais. Revise o local onde o PDF será salvo. Continuar?"))window.print()
});
window.addEventListener("beforeprint",buildPrint);
$("#newRecord").addEventListener("click",()=>{
 if(!confirm("Limpar o formulário e iniciar um novo registro?"))return;
 $("#rpdForm").reset();$$('input[type="checkbox"]').forEach(x=>x.checked=false);$("#date").value=new Date().toISOString().slice(0,10);bindValues();updateSelections();showStep(1)
});
function bindValues(){ $("#beforeOut").textContent=`${$("#before").value}/100`;$("#afterOut").textContent=`${$("#after").value}/100` }
$("#sharePage").addEventListener("click",async()=>{
 const text="RPD — ferramenta psicoeducativa para organizar situação, emoções, pensamentos e próximos passos.";
 try{if(navigator.share)await navigator.share({title:"RPD",text,url:PAGE_URL});else if(navigator.clipboard){await navigator.clipboard.writeText(PAGE_URL);toast("Link copiado.")}else prompt("Copie o link:",PAGE_URL)}catch(e){}
});
$("#contactBtn").addEventListener("click",()=>{
 const name=val("contactName"),msg=val("contactMessage");if(!msg){toast("Escreva uma mensagem antes de abrir o WhatsApp.");$("#contactMessage").focus();return}
 const text=`Olá${name?", prefiro ser chamado(a) de "+name:""}. ${msg}`;
 window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`,"_blank","noopener,noreferrer")
});
setupChoices();bindRange("before","beforeOut");bindRange("after","afterOut");$("#date").value=new Date().toISOString().slice(0,10);updateSelections();progress();
})();
</script>
</body>
